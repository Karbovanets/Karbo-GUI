name: Build check

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    env:
      BOOST_ROOT: C:\thirdparties\boost-1.86.0
      VCINSTALLDIR: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Boost 1.86
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: C:\thirdparties\boost-1.86.0
          key: windows-2022-boost-1.86.0-msvc143

      - name: Download and Install Boost 1.86 for MSVC 14.3 (VS 2022)
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          $Url = "https://sourceforge.net/projects/boost/files/boost-binaries/1.86.0/boost_1_86_0-msvc-14.3-64.exe"
          $OutputPath = "C:\\Users\\runneradmin\\AppData\\Local\\Temp\\boost-installer.exe"
          curl -L $Url -o $OutputPath
          Start-Process -Wait -FilePath $OutputPath "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\\thirdparties\\boost-1.86.0"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: '6.9.2'
          host: 'windows'
          target: 'desktop'
          install-deps: 'true'

      - name: Build
        shell: powershell
        id: build
        env:
          GIT_REDIRECT_STDERR: '2>&1'
        run: |
          $build_folder = "build"
          $krb_ver = git describe --tags --abbrev=0
          $release_name = "Karbo-GUI-win64-${krb_ver}"
          $release_folder = "Release"
          cmake -S . -B "$build_folder" -DBOOST_ROOT="$env:BOOST_ROOT" -DBOOST_INCLUDE_DIRS="$env:BOOST_ROOT/include" -G "Ninja Multi-Config" -DARCH=default
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$build_folder" --config Release --parallel --target Karbo-GUI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd "$build_folder"
          mkdir "$release_folder/$release_name"
          cd "$release_folder"
          cp Karbo-GUI.exe "$release_name/"
          cp "../../LICENSE" "$release_name/LICENSE.txt"
          cp "C:/Program Files/OpenSSL/bin/libssl*.dll" "$release_name/"
          cp "C:/Program Files/OpenSSL/bin/libcrypto*.dll" "$release_name/"
          windeployqt --release Karbo-GUI.exe --dir "$release_name/"
          Compress-Archive -Path "$release_name/" -DestinationPath "$release_name.zip"
          $asset_path = "./$build_folder/$release_folder/$release_name.zip"
          echo "release_name=${release_name}.zip" >> $env:GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $env:GITHUB_OUTPUT

      - name: Create Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.build.outputs.asset_path }}
          name: ${{ steps.build.outputs.release_name }}

  build-macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          install-deps: 'true'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Boost (ARM64)
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.86.0
          platform: macos
          platform_version: 15
          toolset: clang
          arch: aarch64

      - name: Install other deps
        run: |
          brew install gcc openssl

      - name: Build
        id: build
        run: |
          BOOST_ROOT=${{ steps.install-boost.outputs.BOOST_ROOT }}
          Boost_INCLUDE_DIR=$BOOST_ROOT/include
          Boost_LIBRARY_DIR=$BOOST_ROOT/lib
          build_folder="build/release"
          krb_ver=$(git describe --tags --abbrev=0)
          release_name="Karbo-GUI-macOS-$krb_ver"
          app_name="Karbo-GUI.app"
          mkdir -p "$build_folder"
          cd "$build_folder"
          cmake ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DBoost_INCLUDE_DIR="$Boost_INCLUDE_DIR" \
            -DBoost_LIBRARY_DIR="$Boost_LIBRARY_DIR" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBoost_USE_STATIC_LIBS=ON \
            -DBoost_COMPILER=-clang \
            -DBoost_ARCHITECTURE=-a64 \
            -DBoost_THREADAPI=pthread
          make -j"$(sysctl -n hw.ncpu)"
          macdeployqt "$app_name"
          cpack
          mv *.dmg "$release_name".dmg
          asset_path="./$build_folder/$release_name.dmg"
          echo "release_name=${release_name}.dmg" >> $GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT

      - name: Create Artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.build.outputs.asset_path }}
          name: ${{ steps.build.outputs.release_name }}

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: '6.9.2'
          target: 'desktop'
          install-deps: 'true'

      - name: Build
        id: build
        run: |
          sudo apt update -y
          sudo apt install -y libboost-all-dev
          build_folder="build/release"
          krb_ver=$(git describe --tags --abbrev=0)
          release_name=Karbo-GUI-ubuntu-24.04-"$krb_ver"
          app_name="Karbo-GUI"
          mkdir -p "$build_folder"
          cd "$build_folder"
          cmake -D ARCH=default -D CMAKE_BUILD_TYPE=Release -D CMAKE_POSITION_INDEPENDENT_CODE:BOOL=true -D BOOST_IGNORE_SYSTEM_PATHS_DEFAULT=ON -D BOOST_ROOT=/usr ../..
          make -j"$(nproc)"
          tar -czf "$release_name".tar.gz "$app_name"
          asset_path="./$build_folder/$release_name".tar.gz
          echo "release_name=${release_name}.tar.gz" >> $GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT

      - name: Create Artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.build.outputs.asset_path }}
          name: ${{ steps.build.outputs.release_name }}

  build-appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.1.1
        with:
          version: '6.9.2'
          target: 'desktop'
          install-deps: 'true'

      - name: Install build deps
        run: |
          sudo apt update -y
          sudo apt install -y libboost-all-dev libssl-dev libgl1-mesa-dev libfuse2 wget file

      - name: Build
        id: build
        run: |
          krb_ver=$(git describe --tags --abbrev=0)
          mkdir -p build/release
          cd build/release
          cmake -D ARCH=default -D CMAKE_BUILD_TYPE=Release -D CMAKE_POSITION_INDEPENDENT_CODE:BOOL=true -D BOOST_IGNORE_SYSTEM_PATHS_DEFAULT=ON -D BOOST_ROOT=/usr ../..
          make -j"$(nproc)"
          echo "krb_ver=${krb_ver}" >> $GITHUB_OUTPUT

      - name: Create AppImage
        id: appimage
        run: |
          krb_version="${{ steps.build.outputs.krb_ver }}"
          appimage_name=Karbo-GUI-"$krb_version".AppImage
          cd appimage
          chmod +x ./create-appimage.sh
          ./create-appimage.sh
          mv Karbo-GUI-*.AppImage "$appimage_name" || mv *.AppImage "$appimage_name"
          ls -l "$appimage_name"
          cd ..
          asset_path="./appimage/$appimage_name"
          echo "artifact_name=${appimage_name}" >> $GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT

      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appimage.outputs.artifact_name }}
          path: ${{ steps.appimage.outputs.asset_path }}
